<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>PhotoBooth</title>
</head>
<body>
    <div id="main">
        <div class="text jersey-25-regular">
            Capture
        </div>
        <div class="camera">
            <div class="video">
        <canvas id="canvas" width="1100" height="800" style="width:100%;max-width:640px;
                     background:#222;border-radius:12px;"></canvas>
            </div>
            <div class="controls">
                <button id="start" class="jersey-25-regular">Start</button>
                <button id="stop" class="jersey-25-regular">Click</button>
            </div>
        </div>
        <video id="camera" autoplay playsinline style="display: none;"></video>
    </div>
    <div class="downlaod" style="display: flex; justify-content: center; align-items: center;">
        <button id = "download">downlaod</button>
    </div>

    <script>
       const video = document.getElementById("camera");
       const canvas = document.getElementById("canvas");
       const start = document.getElementById("start");
       const stop = document.getElementById("stop");
       const ctx = canvas.getContext("2d");
       const download = document.getElementById("download")

       let stream;
       let animation;

       function drawframe(){
        if(video.readyState >= 2){
            ctx.save();
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0 ,0 , canvas.width, canvas.height)
            ctx.restore();
            ctx.fillStyle = "rgba(255,0,0,0.2)";
            ctx.fillRect(0,0, canvas.width, canvas.height);
            ctx.font = "bold 32px Arial";
            ctx.fillStyle = "#ffffff";
            ctx.fillText("Rec", 100, 100);
            ctx.strokeRect(0, 0, canvas.width, canvas.height)
            ctx.strokeStyle = "black";
            ctx.lineWidth = 70;

        }
        animation = requestAnimationFrame(drawframe);
       }

       start.onclick = async () =>{
        try{
            stream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false,
            })
            video.srcObject = stream
            await video.play()
            cancelAnimationFrame(animation);
            drawframe();
        }
        catch(error){
            console.log(error)
        }
       }

       stop.onclick = async () =>{
        cancelAnimationFrame(animation)
        if(stream){
        stream.getTracks.forEach(track => track.stop());
        stream = null;
        }
        video.srcObject = null
        ctx.clearRect(0,0,canvas.width, canvas.height);
       }

       download.addEventListener("click",()=> {
         canvas.toBlob((blob) => {
        if (!blob) return;

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = "frame.png";
        link.click();

        URL.revokeObjectURL(url);
    }, "image/png");
       });
    </script>
</body>
</html>
